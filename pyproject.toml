[project]
name = "sid-agent"
version = "0.1.0"
description = "SID Agent FastAPI application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "pymongo>=4.13,<5.0",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "pypdf>=6.12,<7",
    "psutil>=7,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "mongodb: requires a disposable MongoDB replica set",
    "qdrant: requires a disposable Qdrant service",
    "embeddings: opt-in smoke test with the downloaded local model",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
